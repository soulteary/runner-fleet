# soulteary/ci-recipes 的 runner-fleet recipe 从这里读本仓库自己的事实。
#
# 放在这里而不是编进那个二进制里，是为了让「加第七种 UI 语言」这类改动仍然是本仓库
# 的一次提交，而不是 ci-recipes 发一次版 + 这边跟着换 pin。缺这个文件时 recipe 会用
# 内置默认值，而默认值就是下面这些；改这里生效，改默认值要发版。
#
# 格式：KEY = VALUE，# 起注释。未知 key 直接报错（打错字被静默忽略，就是「配好的检查
# 悄悄不再检查它被配来检查的东西」的由来）。list 型 key 首次出现替换默认值、后续追加。
#
# 用法：ci-recipes runner-fleet check-version-consistency
#       ci-recipes runner-fleet check-docs-structure

# 基准版本：internal/config/config.go 里默认 Runner 镜像的兜底 tag。那是唯一真正影响
# 运行行为的版本号，其余都是文档与示例，必须跟它一致。
version_source = internal/config/config.go
version_baseline_regex = tag = "(v[0-9]+\.[0-9]+\.[0-9]+)"

# 两种引用形状：字面 vX.Y.Z，以及 ldflags 里的 main.Version=X.Y.Z（按 vX.Y.Z 比）。
# 捕获组 1 是版本，=> 后面是比较时渲染用的模板。
version_reference_regex = (v[0-9]+\.[0-9]+\.[0-9]+)
version_reference_regex = main\.Version=([0-9]+\.[0-9]+\.[0-9]+) => v${1}

# 正文确需引用历史版本号时（如变更说明），在该行加这个标记即可跳过。
version_ignore_marker = version-check-ignore

# 扫描范围，按 git pathspec 传给 git ls-files，所以匹配语义就是 git 的。
# '*Dockerfile*' 而非 'Dockerfile*'：后者只匹配仓库根目录，会漏掉
# examples/runner-images/ 下引用了本仓库镜像 tag 的示例。
version_globs = *.md *.yml *.yaml *.example Makefile *Dockerfile* *.sh *.go

# CHANGELOG 天然包含所有历史版本号，不参与校验。
version_exclude = CHANGELOG.md

# 译文章节结构校验：比标题的层级序列，不比标题文字（那本来就该被翻译）。
docs_root = docs
docs_languages = zh fr de ko ja
docs_files = development.md guide.md README.md

# docs_files 只列这三份，是两条边界叠出来的结果，都不是遗漏：
#
# 一、docs/ 下的其余文件刻意不做译文。ci-recipes-migration.md 与
#    docs-improvement-plan.md 都是维护者的工作记录，不是产品文档。
# 二、examples/ 下的两份 README 目前只有中文。这是取舍不是漏翻，选项与建议见
#    docs-improvement-plan.md 第 7 节；在作者拍板之前，
#    internal/docsconsistency 的 examples_policy_test.go 盯着这个策略，
#    新增一份 examples README 必须先在那里补一行，也就是必须先决定它要不要译文。
#
# 本文件管的是「哪些文件要比标题结构」。标题之下的内容量（表格行、代码块、列表项、
# 链接目标）由 internal/docsconsistency 的 translations_test.go 比，读的也是这里的
# docs_root / docs_languages / docs_files——加第七种语言仍然只改上面那一行。
