name: CI (Windows services)

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Parse Linux and Windows GitHub commands
        run: node --test scripts/test-command-parser.cjs
      - name: Windows installer and service controller tests
        env:
          RUNNER_FLEET_SCM_TESTS: '1'
        run: go test -race -count=1 ./internal/windowsrunner
      - name: Windows API, configuration and environment tests
        run: go test -race -count=1 -run 'TestWindows|TestDesiredState' ./internal/config ./internal/handler ./internal/runner ./internal/childenv ./cmd/runner-manager
      - name: Build
        run: go build -o runner-manager.exe ./cmd/runner-manager
      - name: Install and exercise Manager service
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          try {
            .\runner-manager.exe service install -config "$env:RUNNER_TEMP\RunnerFleetData\config.yaml"
            if ($LASTEXITCODE -ne 0) { throw 'service install failed' }
            .\runner-manager.exe service start
            if ($LASTEXITCODE -ne 0) { throw 'service start failed' }
            $healthy = $false
            for ($attempt = 0; $attempt -lt 30; $attempt++) {
              try {
                Invoke-WebRequest http://127.0.0.1:8080/health | Out-Null
                $healthy = $true
                break
              } catch { Start-Sleep -Seconds 1 }
            }
            if (-not $healthy) { throw 'Manager health check failed' }
            .\runner-manager.exe service stop
            if ($LASTEXITCODE -ne 0) { throw 'service stop failed' }
          } finally {
            .\runner-manager.exe service uninstall
          }
