# CI：Runner Manager 的测试与构建
name: CI (Manager)

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

env:
  GO_VERSION: "1.26.0"
  WORKING_DIR: .

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Check both images share the apt manifest
        run: |
          for f in Dockerfile Dockerfile.runner; do
            grep -q 'scripts/apt-packages.txt' "$f" || {
              echo "::error file=$f::镜像依赖须从 scripts/apt-packages.txt 安装，勿在 Dockerfile 内另写包列表（历史上两边漂移过，见 #4 之后的 job 失败）"
              exit 1
            }
          done
          echo "Manager 与 Runner 镜像均使用共享依赖清单"

      - name: Detect Go module root
        id: modroot
        uses: ./.github/actions/detect-go-module-root
        with:
          working_dir: ${{ env.WORKING_DIR }}

      - name: Set up Go
        if: steps.modroot.outputs.found == 'true'
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: ${{ steps.modroot.outputs.root }}/go.sum

      - name: Vet
        if: steps.modroot.outputs.found == 'true'
        run: go vet ./cmd/runner-manager/... ./internal/...
        working-directory: ${{ steps.modroot.outputs.root }}

      - name: Lint
        if: steps.modroot.outputs.found == 'true'
        uses: golangci/golangci-lint-action@v9
        with:
          version: latest
          args: --max-same-issues=100000 ./cmd/runner-manager/... ./internal/...
          working-directory: ${{ steps.modroot.outputs.root }}

      # -race：这个项目的并发面不小——单 worker 的注册队列、runnerOps 锁、
      # EnsureAgentToken 的「单一胜者」创建，都是靠约定而非类型系统保证的。
      # 竞态退化在普通 go test 下是静默的，只会表现为线上偶发的怪状态。
      - name: Run tests
        if: steps.modroot.outputs.found == 'true'
        run: go test -race -v ./cmd/runner-manager/... ./internal/...
        working-directory: ${{ steps.modroot.outputs.root }}

      - name: Skip (no project structure)
        if: steps.modroot.outputs.found != 'true'
        run: 'echo "Skipped: no go.mod + cmd/runner-manager in this repo."'

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [test]
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Detect Go module root
        id: modroot
        uses: ./.github/actions/detect-go-module-root
        with:
          working_dir: ${{ env.WORKING_DIR }}

      - name: Set up Go
        if: steps.modroot.outputs.found == 'true'
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: ${{ steps.modroot.outputs.root }}/go.sum

      - name: Get version information
        if: steps.modroot.outputs.found == 'true'
        id: version
        run: |
          VERSION=$(git describe --tags --abbrev=0 2>/dev/null || echo "dev-$(git rev-parse --short HEAD)")
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Build Manager
        if: steps.modroot.outputs.found == 'true'
        run: |
          go build -ldflags "-s -w -X main.Version=${{ steps.version.outputs.version }}" -o runner-manager ./cmd/runner-manager
        working-directory: ${{ steps.modroot.outputs.root }}

      - name: Init example config
        if: steps.modroot.outputs.found == 'true'
        run: mkdir -p config && cp config.yaml.example config/config.yaml
        working-directory: ${{ steps.modroot.outputs.root }}

      - name: Verify binary
        if: steps.modroot.outputs.found == 'true'
        run: |
          ./runner-manager -version
          ./runner-manager -config config/config.yaml &
          PID=$!
          trap "kill $PID 2>/dev/null || true; wait $PID 2>/dev/null || true" EXIT
          for i in 1 2 3 4 5; do sleep 1; curl -sf http://localhost:8080/health | grep -q '"status":"ok"' && break; done
          curl -sf http://localhost:8080/health | grep -q '"status":"ok"' || (echo "health check failed"; exit 1)
          kill $PID 2>/dev/null || true
          wait $PID 2>/dev/null || true
        working-directory: ${{ steps.modroot.outputs.root }}

      - name: Skip (no project structure)
        if: steps.modroot.outputs.found != 'true'
        run: 'echo "Skipped: no go.mod + cmd/runner-manager in this repo."'

  image:
    name: Image build context
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      # 与 CI (Agent) 中的同名 job 成对：镜像的 builder 阶段只 COPY 了工作区的一部分，
      # 完整工作区里的 go build 验不出构建上下文缺路径。Manager 侧目前 COPY 了 cmd 与
      # internal 全量、没出过问题，这一步是防止它哪天被收窄成 Dockerfile.runner 那样。
      - name: Build Manager image builder stage
        run: docker build --target builder -f Dockerfile .
